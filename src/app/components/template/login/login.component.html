<div id="login" class="login-wrapper">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-80">
      <div class="col-md-5 col-lg-4">
        <div class="login-card">
          <!-- Header -->
          <div class="login-header text-center mb-4">
            <div class="login-icon mb-3">
              <i class="fa fa-sign-in" aria-hidden="true"></i>
            </div>
            <h4 class="mb-2">Welcome Back</h4>
            <p class="text-muted small">Login required to place your order</p>
          </div>

          <!-- Form -->
          <form novalidate #myform="ngForm">
            <!-- Email Field -->
            <div class="form-group mb-3">
              <label for="email" class="form-label">
                <i class="fa fa-envelope" aria-hidden="true"></i> Email
              </label>
              <input 
                type="email" 
                id="email" 
                [(ngModel)]="email" 
                name="email" 
                class="form-control form-control-lg" 
                placeholder="example@gmail.com"
                required>
            </div>

            <!-- Password Field -->
            <div class="form-group mb-3">
              <label for="password" class="form-label">
                <i class="fa fa-key" aria-hidden="true"></i> Password
              </label>
              <input 
                type="password" 
                id="password" 
                [(ngModel)]="password" 
                name="password" 
                class="form-control form-control-lg" 
                placeholder="••••••••••"
                required>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="form-group d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input 
                  class="form-check-input" 
                  type="checkbox" 
                  id="remember-me" 
                  name="remember-me">
                <label class="form-check-label" for="remember-me">
                  Remember me
                </label>
              </div>
              <a routerLink="#" class="text-decoration-none forgot-link">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <button 
              type="submit" 
              class="btn btn-danger btn-lg w-100 mb-3 login-btn" 
              id="btn-user-login" 
              (click)="login(myform)" 
              [disabled]="myform.invalid && myform.touched">
              <i class="fa fa-sign-in"></i> LOGIN
            </button>

            <!-- Register Link -->
            <div class="text-center register-link">
              <span class="text-muted">New Customer?</span> 
              <a routerLink="/register" class="text-decoration-none fw-bold">Register here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
